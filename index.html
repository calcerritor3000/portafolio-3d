<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17131e" />
    <meta name="description" content="Portafolio 3D interactivo de Jorge Calcerrada, desarrollador de aplicaciones multiplataforma." />
    <title>Jorge Calcerrada · Portafolio 3D</title>
    <style>
      /* Pantalla mínima antes de que llegue el JS: nunca hay pantalla en blanco */
      html, body, #root { margin: 0; height: 100%; background: #17131e; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #e8e6f2;
        font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .25em; }
      .boot span { opacity: .5; animation: boot 1s ease-in-out infinite alternate; }
      @keyframes boot { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span>CARGANDO…</span></div></div>
    <noscript>Este portafolio 3D necesita JavaScript. Versión clásica: https://jorge-calcerrada.expo.app/</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
